<article class="lead">
  <a href="{{URL}}" target="_blank" rel="noopener">
    {{IMAGE}}
    <div class="lead-grid">
      <div class="lead-head">
        <p class="kicker">{{KICKER}}</p>
        <h1>{{TITLE}}</h1>
      </div>
      <div class="lead-body">
        <p class="deck">{{SUMMARY}}</p>
        <p class="byline"><span class="src">{{SOURCE}}</span> · <span>{{DATE}}</span> · <span class="more">Read the dispatch →</span></p>
      </div>
    </div>
  </a>
</article>
