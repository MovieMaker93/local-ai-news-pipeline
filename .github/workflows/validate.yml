name: Validate

# Static checks only — no secrets, no network calls to the private inference
# server or xAI, because this repo has no CI-accessible way to reach either.
# Green here means "nothing a computer can check without secrets is broken";
# it is not a claim that a PR is safe to merge. See CONTRIBUTING.md.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run static checks
        run: python3 .github/scripts/validate_repo.py
